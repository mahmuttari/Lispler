# Android uygulamasını derler.
# - Her push'ta: elle kurulabilen APK (Artifacts bölümünden indirilir)
# - ANDROID_KEYSTORE_BASE64 ve ANDROID_KEYSTORE_PASSWORD secret'ları varsa: Google Play'e yüklenecek imzalı AAB
name: Android

on:
  push:
    paths:
      - 'android/**'
      - 'app/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      # GitHub'ın Ubuntu sunucularında Android SDK hazır kurulu gelir (ANDROID_HOME)

      - name: APK derle
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: NotDefteri-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Play Store paketi (AAB) derle
        if: ${{ env.KS != '' }}
        working-directory: android
        run: |
          echo "$KS" | base64 -d > upload-keystore.jks
          printf 'storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=upload\nkeyPassword=%s\n' "$KS_PASSWORD" "$KS_PASSWORD" > keystore.properties
          ./gradlew bundleRelease --no-daemon
          rm -f upload-keystore.jks keystore.properties

      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('android/app/build/outputs/bundle/release/app-release.aab') != '' }}
        with:
          name: NotDefteri-play-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
