# Hayalet Avcıları: Android projesinin derlendiğini denetler (imzasız APK, Artifacts bölümünden indirilir).
# Play'e yüklenecek imzalı AAB yerelde yükleme anahtarıyla derlenir (hayalet-avcilari/README.md).
name: Android (Hayalet Avcıları)

on:
  push:
    paths:
      - 'hayalet-avcilari/**'
      - '!hayalet-avcilari/play-istek.txt'
      - '!hayalet-avcilari/magaza/**'
      - '.github/workflows/hayalet-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: hayalet-avcilari
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      # GitHub'ın Ubuntu sunucularında Android SDK hazır kurulu gelir (ANDROID_HOME)
      - run: npm ci
      - run: npx cap sync android
      - name: APK derle
        working-directory: hayalet-avcilari/android
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: HayaletAvcilari-imzasiz-apk
          path: hayalet-avcilari/android/app/build/outputs/apk/release/*.apk
