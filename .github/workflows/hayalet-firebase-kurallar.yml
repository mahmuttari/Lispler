# Hayalet Avcıları: Firebase kurallarını (RTDB + Firestore) emülatörde sınar.
# Kuralları YAYINLAMAZ; yayın Firebase konsolundan elle yapılır (hayalet-avcilari/firebase/README.md).
name: Firebase kuralları (Hayalet Avcıları)

on:
  push:
    paths:
      - 'hayalet-avcilari/firebase/**'
      - '.github/workflows/hayalet-firebase-kurallar.yml'
  pull_request:
    paths:
      - 'hayalet-avcilari/firebase/**'
      - '.github/workflows/hayalet-firebase-kurallar.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hayalet-avcilari/firebase
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm test
