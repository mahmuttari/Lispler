# iOS uygulamasını Mac'e gerek kalmadan GitHub'ın macOS sunucularında derler.
# - Her push'ta: imzasız simülatör derlemesi (kod derleniyor mu kontrolü)
# - Elle çalıştırınca ("Run workflow", upload = true): imzalayıp TestFlight / App Store Connect'e yükler.
#   Gerekli GitHub Secrets: APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (README'ye bakın)
name: iOS

on:
  push:
    paths:
      - 'ios/**'
      - 'app/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:
    inputs:
      upload:
        description: "App Store Connect'e (TestFlight) yükle"
        type: boolean
        default: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Xcode sürümünü seç
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Xcode projesini oluştur (XcodeGen)
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Simülatör için derle (imzasız)
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.upload }}
        run: |
          set -o pipefail
          cd ios
          xcodebuild -project NotDefteri.xcodeproj -scheme NotDefteri -configuration Debug \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build 2>&1 \
            | grep -E "error:|warning: .*/ios/NotDefteri/|BUILD (SUCCEEDED|FAILED)" | head -80

      - name: Arşivle ve App Store Connect'e yükle
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -o pipefail
          cd ios
          KEY_PATH="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s' "$ASC_KEY_P8" > "$KEY_PATH"
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $KEY_PATH -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID"
          xcodebuild -project NotDefteri.xcodeproj -scheme NotDefteri -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/NotDefteri.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            $AUTH archive | tail -60
          /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_TEAM_ID" ExportOptions.plist
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/NotDefteri.xcarchive" \
            -exportOptionsPlist ExportOptions.plist -exportPath "$RUNNER_TEMP/export" $AUTH | tail -60
