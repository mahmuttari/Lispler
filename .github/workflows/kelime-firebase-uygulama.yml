# Kelime Bilcek — Firebase projesine (kelime-bilcek) Android uygulamasını ve imza parmak izlerini ekler
# (kelime-bilcek/firebase/uygulama.mjs, Firebase Management API). Komutlar kelime-bilcek/firebase/uygulama-istek.txt'de:
#   durum | android ekle | sha ekle <parmak izi>
# Kimlik anahtarsız: Play işleriyle aynı Workload Identity hizmet hesabı (android/play-kimlik.env). Hesabın kelime-bilcek
# projesinde roles/firebase.admin rolü olmalı (kelime-bilcek/firebase/README.md › Kurulum).
name: Firebase uygulaması (Kelime Bilcek)

on:
  push:
    paths: ['kelime-bilcek/firebase/uygulama-istek.txt']
  workflow_dispatch:

concurrency:
  group: kelime-firebase-uygulama
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  uygulama:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Komutlar ve kimlik
        run: |
          grep -v '^[[:space:]]*#' kelime-bilcek/firebase/uygulama-istek.txt | tr -d '\r' | sed '/^[[:space:]]*$/d' > "$RUNNER_TEMP/komutlar"
          while IFS= read -r K; do case "$K" in "durum"|"android ekle"|"sha ekle "[0-9A-Fa-f]*) ;; *) echo "::error::geçersiz komut: $K"; exit 1;; esac; done < "$RUNNER_TEMP/komutlar"
          echo "Komutlar:"; cat "$RUNNER_TEMP/komutlar"
          grep -E '^(PLAY_WIF_PROVIDER|PLAY_SERVICE_ACCOUNT)=' android/play-kimlik.env >> "$GITHUB_ENV"
          if [ -s "$RUNNER_TEMP/komutlar" ]; then echo "KOMUT_VAR=1" >> "$GITHUB_ENV"; fi
      - id: auth
        if: env.KOMUT_VAR == '1'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.PLAY_WIF_PROVIDER }}
          service_account: ${{ env.PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform,https://www.googleapis.com/auth/firebase
      - name: Komutları çalıştır
        if: env.KOMUT_VAR == '1'
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          while IFS= read -r K; do echo; echo "════ $K ════"; node kelime-bilcek/firebase/uygulama.mjs $K < /dev/null; done < "$RUNNER_TEMP/komutlar"
