# Master Office (com.ofivora.app) — Google Play Developer API işleri (android/play.mjs, PLAY_UYGULAMA=masteroffice).
# Düzen play-kiblebul.yml ile aynıdır; komutlar master-office/play-istek.txt'ye yazılır (her satır bir komut, sırayla;
# biri hata verirse sonrakiler çalışmaz). Kimlik anahtarsız: GitHub → Workload Identity → android/play-kimlik.env'deki
# hizmet hesabının kısa ömürlü belirteci. Hizmet hesabı Play Console → Kullanıcılar ve izinler'de bu uygulamaya da
# verilmiş olmalı (master-office/magaza/PLAY-YAYIN.md).
# Kaynak kodu bu depoda yoktur; AAB bu herkese açık depoya konmaz (içinde kodun
# R8 eşleme dosyası var). AAB'ler Play Console'dan elle yüklenir; "yukle" komutu, master-office/surum.gradle'daki
# versionCode Play'de zaten varsa paketi yeniden yüklemeden kanala koyar (sürüm notlarıyla) ve onayla incelemeye gönderir.
# AdMob TEST kimlikli bir AAB (3.5.1) üretime gönderilmez (PLAY-YAYIN.md).
name: Google Play (Master Office)

on:
  push:
    paths: ['master-office/play-istek.txt']
  workflow_dispatch:

concurrency:
  group: play-masteroffice
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Komutlar ve kimlik
        id: hazir
        run: |
          grep -v '^[[:space:]]*#' master-office/play-istek.txt | tr -d '\r' | sed '/^[[:space:]]*$/d' > "$RUNNER_TEMP/komutlar" || true
          while IFS= read -r K; do case "$K" in *[!a-z\ ]*) echo "::error::geçersiz komut: $K"; exit 1;; esac; done < "$RUNNER_TEMP/komutlar"
          echo "Komutlar:"; cat "$RUNNER_TEMP/komutlar"
          if [ ! -s "$RUNNER_TEMP/komutlar" ]; then echo "komut yok"; echo "tamam=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          grep -E '^(PLAY_WIF_PROVIDER|PLAY_SERVICE_ACCOUNT)=' android/play-kimlik.env >> "$GITHUB_ENV"
          . android/play-kimlik.env
          if [ -z "$PLAY_WIF_PROVIDER" ] || [ -z "$PLAY_SERVICE_ACCOUNT" ]; then
            echo "::warning::android/play-kimlik.env boş: önce Cloud Shell'de android/play-kurulum.sh çalıştırılmalı. Play'e bağlanılmadı."
            echo "tamam=false" >> "$GITHUB_OUTPUT"
          else
            echo "tamam=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Mağaza dosyaları denetimi (metin sınırları, Veri güvenliği CSV'si, görsel ölçüleri, gizlilik sayfası)
        if: steps.hazir.outputs.tamam == 'true'
        run: node --test master-office/test/*.test.mjs
      - name: Üretime TEST kimlikli sürüm gönderilmez
        if: steps.hazir.outputs.tamam == 'true'
        run: |
          VC=$(sed -nE 's/^ *versionCode +([0-9]+).*/\1/p' master-office/surum.gradle | head -1)
          # 3005001 (3.5.1) Google'ın deneme reklam kimlikleriyle derlendi: yalnız dahili teste konabilir
          if [ "$VC" = 3005001 ] && grep -qE '^[[:space:]]*yukle' "$RUNNER_TEMP/komutlar" && ! grep -qE '^[[:space:]]*yukle .*dahili' "$RUNNER_TEMP/komutlar"; then
            echo "::error::3.5.1 (3005001) AdMob TEST kimlikli: üretime konmaz. Gerçek kimlikli AAB gelince surum.gradle güncellenir."
            exit 1
          fi
      - id: auth
        if: steps.hazir.outputs.tamam == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.PLAY_WIF_PROVIDER }}
          service_account: ${{ env.PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
      - name: play.mjs
        if: steps.hazir.outputs.tamam == 'true'
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          PLAY_UYGULAMA: masteroffice
        run: |
          while IFS= read -r K; do echo; echo "════ $K ════"; node android/play.mjs $K < /dev/null; done < "$RUNNER_TEMP/komutlar"
