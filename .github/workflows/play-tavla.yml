# Tavla — Google Play Developer API işleri (android/play.mjs, PLAY_UYGULAMA=tavla). Not Defteri: play.yml. GENEL-KONULAR/Takasla'daki düzen:
# komutlar android/play-istek.txt'ye yazılır (her satır bir komut, sırayla; biri hata verirse sonrakiler çalışmaz).
# Kimlik anahtarsız: GitHub → Workload Identity → android/play-kimlik.env'deki hizmet hesabının kısa ömürlü belirteci.
# Hizmet hesabı Play Console → Kullanıcılar ve izinler'de uygulamaya davet edilmiş olmalı (magaza/PLAY-YAYIN.md).
# "yukle" komutu AAB'yi aynı daldaki (yoksa main'deki) son başarılı tavla-android.yml koşusunun "Tavla-aab" artifact'ından alır
# (surum.txt'teki versionCode tavla/android/app/build.gradle ile eşleşmeli; NetcadDevelop/DWG düzeni). Böyle bir
# artifact yoksa iş durur. google-services.json olmadan (surum.txt firebase=yok) derlenmiş paket yüklenmez.
# "imza" komutu SHA-256'yı yazar ve Play'in imzaladığı evrensel APK'dan apksigner ile SHA-1'i çıkarır (Firebase'e eklenir:
# Google ile Giriş, Play'den kurulan uygulamada bu SHA-1 olmadan çalışmaz).
name: Google Play (Tavla)

on:
  push:
    paths: ['tavla/play-istek.txt']
  workflow_dispatch:

concurrency:
  group: play-tavla
  cancel-in-progress: false

permissions:
  contents: read
  actions: read     # derleme artifact'ını indirmek için
  id-token: write

jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Komutlar ve kimlik
        id: hazir
        run: |
          grep -v '^[[:space:]]*#' tavla/play-istek.txt | tr -d '\r' | sed '/^[[:space:]]*$/d' > "$RUNNER_TEMP/komutlar"
          while IFS= read -r K; do case "$K" in *[!a-z\ ]*) echo "::error::geçersiz komut: $K"; exit 1;; esac; done < "$RUNNER_TEMP/komutlar"
          echo "Komutlar:"; cat "$RUNNER_TEMP/komutlar"
          grep -E '^(PLAY_WIF_PROVIDER|PLAY_SERVICE_ACCOUNT)=' android/play-kimlik.env >> "$GITHUB_ENV"
          . android/play-kimlik.env
          if [ -z "$PLAY_WIF_PROVIDER" ] || [ -z "$PLAY_SERVICE_ACCOUNT" ]; then
            echo "::warning::android/play-kimlik.env boş: önce Cloud Shell'de android/play-kurulum.sh çalıştırılmalı (magaza/PLAY-YAYIN.md). Play'e bağlanılmadı."
            echo "tamam=false" >> "$GITHUB_OUTPUT"
          else
            echo "tamam=true" >> "$GITHUB_OUTPUT"
          fi
      - name: AAB'yi derleme artifact'ından al (yalnız "yukle" komutunda)
        if: steps.hazir.outputs.tamam == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -qE '^[[:space:]]*yukle' "$RUNNER_TEMP/komutlar" || { echo "yükleme komutu yok"; exit 0; }
          VC=$(sed -nE 's/^ *versionCode +([0-9]+).*/\1/p' tavla/android/app/build.gradle | head -1)
          for RUN in $( (gh run list -R "$GITHUB_REPOSITORY" -w tavla-android.yml -b "$GITHUB_REF_NAME" -s success -L 15 --json databaseId -q '.[].databaseId'; [ "$GITHUB_REF_NAME" = main ] || gh run list -R "$GITHUB_REPOSITORY" -w tavla-android.yml -b main -s success -L 15 --json databaseId -q '.[].databaseId') ); do
            rm -rf "$RUNNER_TEMP/aab"
            if gh run download "$RUN" -R "$GITHUB_REPOSITORY" -n Tavla-aab -D "$RUNNER_TEMP/aab" 2>/dev/null \
               && grep -qx "versionCode=$VC" "$RUNNER_TEMP/aab/surum.txt" 2>/dev/null; then
              # google-services.json olmadan derlenmiş paket Play'e yüklenmez (Google ile giriş çalışmaz)
              if ! grep -qx "firebase=var" "$RUNNER_TEMP/aab/surum.txt"; then
                echo "::error::koşu $RUN: google-services.json yokken derlenmiş (surum.txt firebase≠var); önce firebase/uygulama-istek.txt › yapilandirma"; exit 1
              fi
              cp "$RUNNER_TEMP/aab/Tavla.aab" dist/Tavla-play.aab
              echo "AAB: derleme koşusu $RUN"; cat "$RUNNER_TEMP/aab/surum.txt"; exit 0
            fi
          done
          echo "::error::versionCode $VC için imzalı derleme artifact'ı (tavla-android.yml) yok"; exit 1
      - id: auth
        if: steps.hazir.outputs.tamam == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.PLAY_WIF_PROVIDER }}
          service_account: ${{ env.PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
      - name: play.mjs
        if: steps.hazir.outputs.tamam == 'true'
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          PLAY_UYGULAMA: tavla
          IMZA_APK: ${{ runner.temp }}/play-imzali-evrensel.apk
        run: |
          while IFS= read -r K; do echo; echo "════ $K ════"; node android/play.mjs $K < /dev/null; done < "$RUNNER_TEMP/komutlar"
      - name: Play uygulama imzasının SHA-1'i (imza komutu çalıştıysa; Firebase'e eklenir)
        if: steps.hazir.outputs.tamam == 'true'
        run: |
          APK="$RUNNER_TEMP/play-imzali-evrensel.apk"
          [ -f "$APK" ] || { echo "imza komutu yok ya da APK indirilmedi"; exit 0; }
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | grep -E "certificate (DN|SHA-1|SHA-256) digest|Signer #1 certificate DN"
          SHA1=$("$APKSIGNER" verify --print-certs "$APK" | sed -nE 's/.*certificate SHA-1 digest: ([0-9a-f]+).*/\1/p' | head -1)
          echo "::notice::Play uygulama imzalama anahtarı SHA-1: $SHA1 (firebase/uygulama-istek.txt › sha ekle $SHA1)"
