<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Let's Picky · Fragman</title>
<style>html,body{margin:0;height:100%;background:#000}iframe{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<script>
  // Uygulamanın fragman oynatıcısı (?v=YouTube kimliği). Mobil uygulama bu sayfayı letspicky.com'dan açar: YouTube
  // gömülü oynatıcısı bir https sayfasının adresini ister; iOS uygulamasının capacitor:// adresinde hata 152/153 verir.
  const id = new URLSearchParams(location.search).get('v') || ''
  if (/^[\w-]{11}$/.test(id)) {
    const frame = document.createElement('iframe')
    frame.src = `https://www.youtube-nocookie.com/embed/${id}?autoplay=1&playsinline=1&rel=0`
    frame.title = 'YouTube'
    frame.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen'
    frame.allowFullscreen = true
    frame.referrerPolicy = 'strict-origin-when-cross-origin'
    document.body.append(frame)
  }
</script>
</body>
</html>
