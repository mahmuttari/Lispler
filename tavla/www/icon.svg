<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- Arka plan: koyu ahşap radial -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%"  stop-color="#5a3818" />
      <stop offset="55%" stop-color="#2a1408" />
      <stop offset="100%" stop-color="#0a0604" />
    </radialGradient>

    <!-- Zar üst yüz: parlak kırmızı -->
    <linearGradient id="diceTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#ff5a3a" />
      <stop offset="100%" stop-color="#c0260f" />
    </linearGradient>
    <!-- Zar sol cephe: koyu kırmızı (en gölgeli) -->
    <linearGradient id="diceLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#8a1a08" />
      <stop offset="100%" stop-color="#4a0c04" />
    </linearGradient>
    <!-- Zar sağ cephe: orta kırmızı -->
    <linearGradient id="diceRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#b8260f" />
      <stop offset="100%" stop-color="#7a1408" />
    </linearGradient>

    <!-- Bardak camı: hafif mavi-gri cam -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#f0f8ff" stop-opacity="0.6" />
      <stop offset="40%" stop-color="#cfe1ec" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#9bb5c4" stop-opacity="0.6" />
    </linearGradient>

    <!-- Türk çayı: tavşankanı -->
    <linearGradient id="teaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#e07a32" />
      <stop offset="35%" stop-color="#b03a12" />
      <stop offset="70%" stop-color="#6b1c08" />
      <stop offset="100%" stop-color="#3a0f04" />
    </linearGradient>

    <!-- Tabak: beyaz porselen radial -->
    <radialGradient id="plateWhite" cx="50%" cy="35%" r="60%">
      <stop offset="0%"   stop-color="#ffffff" />
      <stop offset="60%"  stop-color="#f5ebd5" />
      <stop offset="100%" stop-color="#c8b58a" />
    </radialGradient>

    <!-- Çay yüzey parlama -->
    <radialGradient id="teaShine" cx="40%" cy="20%" r="50%">
      <stop offset="0%"   stop-color="#ffd28a" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#ffd28a" stop-opacity="0" />
    </radialGradient>

    <!-- Gölge filtre -->
    <filter id="dShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" />
      <feOffset dy="14" />
      <feComponentTransfer><feFuncA type="linear" slope="0.55" /></feComponentTransfer>
      <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="1024" height="1024" rx="200" fill="url(#bgGrad)" />
  <rect x="20" y="20" width="984" height="984" rx="180" fill="none"
        stroke="#a87832" stroke-width="6" stroke-opacity="0.4" />

  <!-- ====== ZAR 1 (sol-üst, 3D izometrik, üst yüzde 5 nokta) ====== -->
  <g transform="translate(280, 320) rotate(-8)" filter="url(#dShadow)">
    <!-- Sağ cephe -->
    <polygon points="105,-60 0,0 0,120 105,60" fill="url(#diceRight)" stroke="#3a0a04" stroke-width="3" />
    <!-- Sol cephe -->
    <polygon points="-105,-60 0,0 0,120 -105,60" fill="url(#diceLeft)" stroke="#3a0a04" stroke-width="3" />
    <!-- Üst yüz (rhombus) -->
    <polygon points="0,-120 105,-60 0,0 -105,-60" fill="url(#diceTop)" stroke="#3a0a04" stroke-width="3" />
    <!-- Üst yüze 5 nokta (orta + 4 köşe) — beyaz daireler izo'ya hizalı -->
    <circle cx="0"   cy="-60" r="11" fill="#ffffff" />
    <circle cx="-50" cy="-85" r="11" fill="#ffffff" />
    <circle cx="50"  cy="-85" r="11" fill="#ffffff" />
    <circle cx="-50" cy="-35" r="11" fill="#ffffff" />
    <circle cx="50"  cy="-35" r="11" fill="#ffffff" />
    <!-- Sağ cephede 3 nokta (görünen) -->
    <circle cx="55" cy="-22" r="9" fill="#ffffff" opacity="0.85" />
    <circle cx="55" cy="22"  r="9" fill="#ffffff" opacity="0.85" />
    <circle cx="55" cy="66"  r="9" fill="#ffffff" opacity="0.85" />
    <!-- Üst yüz parlama -->
    <polygon points="0,-118 50,-92 -50,-92" fill="#fff" opacity="0.18" />
  </g>

  <!-- ====== ZAR 2 (sağ-üst, daha eğik, üst yüzde 6 nokta) ====== -->
  <g transform="translate(670, 280) rotate(14)" filter="url(#dShadow)">
    <!-- Sağ cephe -->
    <polygon points="92,-52 0,0 0,104 92,52" fill="url(#diceRight)" stroke="#3a0a04" stroke-width="3" />
    <!-- Sol cephe -->
    <polygon points="-92,-52 0,0 0,104 -92,52" fill="url(#diceLeft)" stroke="#3a0a04" stroke-width="3" />
    <!-- Üst yüz -->
    <polygon points="0,-104 92,-52 0,0 -92,-52" fill="url(#diceTop)" stroke="#3a0a04" stroke-width="3" />
    <!-- Üst yüze 6 nokta (3 sıra × 2 sütun) -->
    <circle cx="-32" cy="-78" r="9" fill="#ffffff" />
    <circle cx="32"  cy="-78" r="9" fill="#ffffff" />
    <circle cx="-22" cy="-52" r="9" fill="#ffffff" />
    <circle cx="22"  cy="-52" r="9" fill="#ffffff" />
    <circle cx="-12" cy="-26" r="9" fill="#ffffff" />
    <circle cx="12"  cy="-26" r="9" fill="#ffffff" />
    <!-- Sol cephede 2 nokta -->
    <circle cx="-50" cy="-12" r="8" fill="#ffffff" opacity="0.85" />
    <circle cx="-50" cy="48"  r="8" fill="#ffffff" opacity="0.85" />
    <!-- Üst yüz parlama -->
    <polygon points="0,-102 44,-80 -44,-80" fill="#fff" opacity="0.16" />
  </g>

  <!-- ====== ÇAY BARDAĞI + TABAK (alt-merkez) ====== -->
  <g transform="translate(512, 750)">
    <!-- Tabak gölgesi -->
    <ellipse cx="0" cy="142" rx="285" ry="34" fill="#000" opacity="0.55" />

    <!-- Tabak — beyaz porselen + kırmızı motif -->
    <ellipse cx="0" cy="128" rx="280" ry="32" fill="#ffffff" stroke="#3a230a" stroke-width="3" />
    <ellipse cx="0" cy="124" rx="270" ry="28" fill="url(#plateWhite)" />

    <!-- Tabak kırmızı kenar bandı (dış halka) -->
    <ellipse cx="0" cy="124" rx="270" ry="28" fill="none" stroke="#c0260f" stroke-width="6" />
    <ellipse cx="0" cy="124" rx="262" ry="24" fill="none" stroke="#8a1a08" stroke-width="2" opacity="0.7" />

    <!-- Tabak motifi: küçük kırmızı çiçekler etrafta -->
    <g fill="#c0260f">
      <!-- 8 küçük çiçek perspektif ellipse üzerinde -->
      <g transform="translate(-220,124)"><circle r="6"/><circle cx="-9" cy="0" r="4"/><circle cx="9" cy="0" r="4"/><circle cx="0" cy="-6" r="4"/><circle cx="0" cy="6" r="4"/></g>
      <g transform="translate(-150,134)"><circle r="6"/><circle cx="-9" cy="0" r="4"/><circle cx="9" cy="0" r="4"/><circle cx="0" cy="-6" r="4"/><circle cx="0" cy="6" r="4"/></g>
      <g transform="translate(-75,140)"><circle r="6"/><circle cx="-9" cy="0" r="4"/><circle cx="9" cy="0" r="4"/><circle cx="0" cy="-6" r="4"/><circle cx="0" cy="6" r="4"/></g>
      <g transform="translate(0,142)"><circle r="6"/><circle cx="-9" cy="0" r="4"/><circle cx="9" cy="0" r="4"/><circle cx="0" cy="-6" r="4"/><circle cx="0" cy="6" r="4"/></g>
      <g transform="translate(75,140)"><circle r="6"/><circle cx="-9" cy="0" r="4"/><circle cx="9" cy="0" r="4"/><circle cx="0" cy="-6" r="4"/><circle cx="0" cy="6" r="4"/></g>
      <g transform="translate(150,134)"><circle r="6"/><circle cx="-9" cy="0" r="4"/><circle cx="9" cy="0" r="4"/><circle cx="0" cy="-6" r="4"/><circle cx="0" cy="6" r="4"/></g>
      <g transform="translate(220,124)"><circle r="6"/><circle cx="-9" cy="0" r="4"/><circle cx="9" cy="0" r="4"/><circle cx="0" cy="-6" r="4"/><circle cx="0" cy="6" r="4"/></g>
    </g>

    <!-- Bardağın oturduğu hafif gölge -->
    <ellipse cx="0" cy="116" rx="120" ry="11" fill="#a87832" opacity="0.4" />
    <ellipse cx="0" cy="114" rx="105" ry="8"  fill="#8a5a18" opacity="0.5" />

    <!-- Buhar -->
    <path d="M-60,-220 Q-78,-265 -60,-310 Q-42,-355 -60,-395"
          stroke="#fff" stroke-opacity="0.55" stroke-width="11" fill="none" stroke-linecap="round" />
    <path d="M0,-238 Q20,-283 0,-328 Q-20,-373 0,-410"
          stroke="#fff" stroke-opacity="0.6" stroke-width="11" fill="none" stroke-linecap="round" />
    <path d="M60,-220 Q42,-265 60,-310 Q78,-355 60,-395"
          stroke="#fff" stroke-opacity="0.55" stroke-width="11" fill="none" stroke-linecap="round" />

    <!-- Bardak silueti (ince belli) -->
    <path d="M-110,-205 L110,-205 L102,-130 Q80,-88 102,-48 L116,90 L-116,90 L-102,-48 Q-80,-88 -102,-130 Z"
          fill="url(#glassGrad)" stroke="#3a230a" stroke-width="5" />

    <!-- İçindeki Türk çayı -->
    <path d="M-100,-190 L100,-190 L94,-128 Q76,-88 94,-50 L106,82 L-106,82 L-94,-50 Q-76,-88 -94,-128 Z"
          fill="url(#teaGrad)" />

    <!-- Çay yüzey parlaması -->
    <ellipse cx="-15" cy="-180" rx="65" ry="10" fill="url(#teaShine)" />

    <!-- Üst altın bant -->
    <path d="M-110,-205 L110,-205 L107,-188 L-107,-188 Z" fill="#d4a340" opacity="0.95" />
    <path d="M-110,-205 L110,-205" stroke="#ffd55c" stroke-width="3" />

    <!-- Alt altın bant -->
    <path d="M-116,90 L116,90 L113,75 L-113,75 Z" fill="#d4a340" opacity="0.92" />

    <!-- Belde çift altın süs -->
    <path d="M-92,-65 Q-75,-50 -92,-30" stroke="#d4a340" stroke-width="2.5" fill="none" opacity="0.7" />
    <path d="M92,-65 Q75,-50 92,-30" stroke="#d4a340" stroke-width="2.5" fill="none" opacity="0.7" />

    <!-- Cam yansımaları -->
    <path d="M-82,-180 Q-70,-100 -78,80" stroke="#fff" stroke-opacity="0.45"
          stroke-width="10" stroke-linecap="round" fill="none" />
    <path d="M-65,-175 L-62,-90" stroke="#fff" stroke-opacity="0.25"
          stroke-width="4" stroke-linecap="round" />
    <path d="M75,-175 L75,-130" stroke="#fff" stroke-opacity="0.35"
          stroke-width="6" stroke-linecap="round" />
  </g>
</svg>
